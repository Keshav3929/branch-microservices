spring:
  application:
    name: api-gateway
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  oauth:
    service-key: ${OAUTH_SERVICE_KEY}