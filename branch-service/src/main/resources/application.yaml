spring:
  application:
    name: branch-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:configserver:"

  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

app:
  oauth:
    service-key: ${OAUTH_SERVICE_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true